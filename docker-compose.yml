
services:
  db:
    image: postgres:16-alpine
    container_name: ai_ct_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
      - "172.17.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_control_tower"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_ct_redis
    restart: unless-stopped
    # AOF persists every write to disk, so queued Celery tasks survive
    # a Redis restart. Without it, `docker compose restart redis` silently
    # drops the entire task queue.
    command: redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
      - "172.17.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
